[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopwright"
version = "0.2.0"
description = "Hub placement and closed-ring cable routing on residential floor plans (Problem IA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]
e2e = ["playwright>=1.40"]

[project.scripts]
loopwright = "loopwright.cli:main"

[tool.setuptools.packages.find]
include = ["loopwright*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dataset: needs data/ResPlan.zip (skipped when missing)"]
