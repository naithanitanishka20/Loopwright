[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopwright"
version = "0.14.0"
description = "Hub placement and closed-ring cable routing on residential floor plans (Problem IA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx2>=2.13"]
e2e = ["playwright>=1.40"]
import = ["ezdxf>=1.1", "pillow>=10", "scikit-image>=0.22", "pdfplumber>=0.11"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
loopwright = "loopwright.cli:main"

[tool.setuptools.packages.find]
include = ["loopwright*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dataset: needs data/ResPlan.zip (skipped when missing)",
    "e2e: browser tests with Playwright (skipped when Playwright is missing)",
]
